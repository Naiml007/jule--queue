name: Java CI with Maven and Windows EXE Packaging

on:
  push:
    branches: [ "main", "feature/discord-rich-presence" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest # Changed to Windows runner

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up JDK 17 for jpackage
      uses: actions/setup-java@v3
      with:
        java-version: '17' # Using JDK 17 for better jpackage support
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Package as EXE using jpackage
      run: |
        jpackage --type exe `
          --input target/ `
          --main-jar resolve-discord-presence-1.0-SNAPSHOT.jar `
          --main-class com.example.resolverp.Main `
          --name "DaVinci Resolve RPC" `
          --app-version 1.0.0 `
          --dest dist/ResolveRPC `
          --win-console `
          --verbose
      shell: pwsh # Using PowerShell for multi-line command

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: resolve-discord-presence-exe
        path: dist/ResolveRPC/DaVinci Resolve RPC.exe # Path to the generated EXE
